<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <!-- This page lives one level down so the clean URL /files works on GitHub
       Pages, while the downloads themselves sit beside it in the same folder.
       The base tag lets every shared path (styles, scripts, nav links) stay
       written exactly as it is on the root level pages. -->
  <base href="../" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Documents and downloads from Adi Sharma, newest first." />
  <meta name="author" content="Adi Sharma" />
  <!-- Unlisted: this page is not in the nav, and this keeps it out of
       search results too, so a direct link stays the only way in. -->
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#fbfbfc" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#08080b" media="(prefers-color-scheme: dark)" />
  <meta property="og:title" content="Files | Adi Sharma" />
  <meta property="og:description" content="Documents and downloads from Adi Sharma, newest first." />
  <meta property="og:type" content="website" />
  <title>Files | Adi Sharma</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%234f46e5'/><text x='16' y='22.5' font-family='ui-monospace,monospace' font-size='16' font-weight='700' fill='white' text-anchor='middle'>A</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;550;600;650;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/style.css" />
  <script>
    (function () {
      try {
        var t = localStorage.getItem('theme') ||
          (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
</head>

<body data-page="files">
  <div class="backdrop" aria-hidden="true"></div>

  <nav class="nav" id="nav" aria-label="Main navigation"></nav>
  <div class="mobile-nav" id="mobile-nav"></div>
  <div class="mobile-backdrop" id="mobile-backdrop"></div>

  <main class="page-wrap" id="page-content"></main>
  <footer class="footer" id="footer"></footer>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="assets/js/data.js"></script>
  <!-- Generated by scripts/sync-files.mjs. Must load after data.js, which it
       extends, and before main.js, which renders from it. -->
  <script src="assets/js/files-manifest.js"></script>
  <script src="assets/js/main.js"></script>
</body>

</html>
